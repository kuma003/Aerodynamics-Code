name: Release

on:
  push:
    branches:
    - main
  workflow_dispatch:
        
permissions:
  contents: write
jobs:
  windows:
    name: Release for Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Extract version from pyproject.toml
        id: get_version
        shell: pwsh
        run: |
          $text = Get-Content pyproject.toml -Raw
          if ($text -match 'version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') {
            "version=$($matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Error "version not found in pyproject.toml"
          }

      - name: Restore clcache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clcache
          key: clcache-${{ runner.os }}-python-3.11-${{ hashFiles('**/pyproject.toml') }}

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pip-cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - name: Install project runtime dependencies
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Nuitka setup + build
        uses: Nuitka/Nuitka-Action@main
        env:
          CLCACHE_DIR: ${{ runner.temp }}/clcache
        with:
          nuitka-version: main
          script-name: main.py
          jobs: 4
          mode: standalone
          enable-plugins: pyside6
          include-data-dir: |
            icons=icons

      - name: Package Nuitka output
        shell: pwsh
        run: |
          # Look for .dist directories under build/ first, then fallback to any .dist in repo
          $found = $null
          if (Test-Path build) {
            $dirs = Get-ChildItem -Path build -Directory -Filter '*.dist' -ErrorAction SilentlyContinue
            if ($dirs -and $dirs.Count -gt 0) { $found = $dirs[0].FullName }
          }
          if (-not $found) {
            $dirs = Get-ChildItem -Directory -Recurse -Filter '*.dist' -ErrorAction SilentlyContinue
            if ($dirs -and $dirs.Count -gt 0) { $found = $dirs[0].FullName }
          }
          if (-not $found) { Write-Error "Could not find Nuitka output directory"; exit 1 }
          Write-Host "Found build output: $found"
          $zipName = "aerodynamics-${{ steps.get_version.outputs.version }}-windows.zip"
          Compress-Archive -Path (Join-Path $found '*') -DestinationPath $zipName

      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            aerodynamics-${{ steps.get_version.outputs.version }}-windows.zip
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        

        